<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class = "start-state">
    <div class = "topnav">
        <h1>Weather app</h1>
        <p id="slogan">Check the weather in any city!</p>
        <input type="text" id="searchInput" placeholder="Search for a city...">
        <button id="searchButton">Search</button>
    </div>

    <div id = "weatherContainer" class = "weather-container">
        <p id="cityName">City Name</p>
        <p id="temperature">Temperature</p>
        <p id="description">Description</p>
        <p id="windSpeed">Wind Speed</p>
    </div> 

    <script src="script.js"></script>

</body>
